allowBuilds:
  # size-limit's estimator. `@swc/core` and `unrs-resolver` left with jest and eslint;
  # nothing in the tree pulls them any more.
  esbuild: true
  # macOS-only optional native watcher, via vite/rollup.
  fsevents: true

# The 24h supply-chain soak, moved here from `.npmrc` so the whole policy reads in one
# place (pnpm 11 takes these settings from the workspace file).
#
# `minimumReleaseAgeStrict` is the important half. pnpm 11's DEFAULT mode is loose: when
# it meets a package younger than the window it does not fail — it silently appends that
# package to `minimumReleaseAgeExclude` and carries on. Under that default the soak
# enforces nothing and the exclusion list grows on its own (observed in sibling repos,
# where routine installs had auto-written real entries nobody asked for). Strict mode
# turns a too-young package into ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION instead, so every
# entry below has to be a deliberate, reviewed pin.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  # tersify 4.0.6 is this package's own upstream, released today from the same
  # modernization sweep and published with provenance. Pinned to the exact version so the
  # soak keeps governing everything else; remove once it ages past the window.
  - tersify@4.0.6
  # tersify 4.0.6's own runtime dependency, released in the same sweep. Excluding tersify
  # alone is not enough — the soak is evaluated per resolved version, transitives included.
  - unpartial@1.0.7
  # First-party packages are exempt from the soak.
  #
  # The soak exists to stop a COMPROMISED THIRD-PARTY release being pulled into a build
  # within hours of publication. It does not describe our own packages: we control what
  # goes into them, and a first-party release is reviewed before it is published, not
  # after. Applying it to ourselves only means a fresh publish is invisible to the next
  # repo in the chain for 24h.
  - assertron
  - satisfier
  - tersify
  - unpartial
  - type-plus
  - path-equal
  - iso-error
  - iso-error-web
  - iso-error-google-cloud-api
  - google-cloud-api
  - standard-log
  - standard-log-color
  - async-fp
  - fsa-emitter
  - progress-str
  - clibuilder
  - args-minus
  - global-store
  - stable-store
  - mocktomata
  - just-func
  - storybook-addon-vis
  - vitest-plugin-vis
  - node-supported-releases
  - '@just-func/*'
  - '@just-web/*'
  - '@mocktomata/*'
  - '@repobuddy/*'
  - '@unional/*'

# Dev-tree advisory with no upgrade path: `js-yaml@4.1.1` arrives through
# `cosmiconfig@9.0.1` under `@commitlint/cli`, and every parent is already on its latest
# release, so bumping a direct dependency reaches none of it. cosmiconfig asks for
# `^4.1.0`, so this stays inside its declared range. `satisfier` has one runtime
# dependency (`tersify`) and commitlint is not it, so none of this ships to consumers.
# Drop the line once the tree resolves past it on its own.
overrides:
  # GHSA-5p4m-2wfm-xmqj (js-yaml), via cosmiconfig
  js-yaml@<4.3.1: '>=4.3.1 <5'
